<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Realco — Agent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════
   DESIGN SYSTEM
═══════════════════════════════ */
:root {
  --bg:            #F8FAFC;
  --surface:       #FFFFFF;
  --primary:       #4F46E5;
  --primary-hover: #4338CA;
  --primary-light: #EEF2FF;
  --accent:        #06B6D4;
  --accent-light:  #ECFEFF;
  --text:          #0F172A;
  --subtext:       #475569;
  --muted:         #94A3B8;
  --border:        #E2E8F0;
  --success:       #10B981;
  --success-light: #D1FAE5;
  --warning:       #F59E0B;
  --warning-light: #FEF3C7;
  --danger:        #EF4444;
  --danger-light:  #FEE2E2;
  --sidebar-w:     240px;
  --topbar-h:      60px;
  --radius:        12px;
  --radius-lg:     16px;
  --shadow-sm:     0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:     0 4px 16px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  --shadow-lg:     0 12px 40px rgba(15,23,42,.10);
  --t: .18s;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════
   SIDEBAR
═══════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
}
.sidebar-logo {
  height: var(--topbar-h); padding: 0 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo-icon {
  width: 32px; height: 32px; background: var(--primary);
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: 14px; color: #fff;
}
.logo-text { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.03em; }
.logo-text span { color: var(--primary); }

.agent-badge {
  margin: 12px;
  background: var(--accent-light);
  border: 1px solid #A5F3FC;
  border-radius: var(--radius); padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
}
.agent-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.agent-info .name  { font-size: 13px; font-weight: 700; color: var(--text); }
.agent-info .role  { font-size: 11px; color: #0E7490; font-weight: 500; margin-top: 1px; }
.verified {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 600; color: var(--success); margin-top: 3px;
}

.nav-section { padding: 16px 10px 4px; }
.nav-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: var(--radius);
  color: var(--subtext); font-size: 13.5px; font-weight: 500;
  cursor: pointer; transition: background var(--t), color var(--t);
  margin-bottom: 1px;
}
.nav-item:hover  { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: #0E7490; font-weight: 600; }
.nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto; background: var(--warning);
  color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 100px;
}
.sidebar-footer {
  margin-top: auto; padding: 12px; border-top: 1px solid var(--border);
}
.logout-btn {
  display: flex; align-items: center; gap: 8px;
  color: var(--subtext); font-size: 13px; font-weight: 500;
  cursor: pointer; padding: 9px 10px; border-radius: var(--radius);
  transition: background var(--t), color var(--t);
}
.logout-btn:hover { color: var(--danger); background: var(--danger-light); }

/* ═══════════════════════════════
   MAIN + TOPBAR
═══════════════════════════════ */
.main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  background: var(--surface); height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40; flex-shrink: 0;
}
.topbar-left { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 8px 14px; width: 260px;
  transition: border-color var(--t), box-shadow var(--t);
}
.search-bar:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  background: var(--surface);
}
.search-bar input {
  border: none; background: transparent; outline: none;
  font-size: 13px; font-family: 'Inter', sans-serif;
  color: var(--text); width: 100%;
}
.search-bar input::placeholder { color: var(--muted); }

.notif-btn {
  width: 36px; height: 36px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; position: relative;
  transition: background var(--t), border-color var(--t);
}
.notif-btn:hover { background: var(--bg); border-color: var(--primary); }
.notif-dot {
  position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--warning); border: 1.5px solid var(--surface);
}

.content { padding: 24px 28px; flex: 1; }

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--text); color: #fff;
  padding: 12px 18px; border-radius: var(--radius-lg);
  font-size: 13.5px; font-weight: 500;
  border-left: 3px solid var(--primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(80px); opacity: 0;
  transition: all .32s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; max-width: 300px;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* PARTS 2–3 STYLES BELOW */

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .main { margin-left: 0; }
  .content { padding: 16px; }
  .search-bar { width: 180px; }
}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">R</div>
    <span class="logo-text">real<span>co</span></span>
  </div>
  <div class="agent-badge">
    <div class="agent-avatar">PS</div>
    <div class="agent-info">
      <div class="name">Priya Sharma</div>
      <div class="role">🤝 Real Estate Agent</div>
      <div class="verified">✅ Verified Agent</div>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <div class="nav-item active"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item"><span class="nav-icon">🔍</span> Browse Listings</div>
    <div class="nav-item"><span class="nav-icon">📋</span> My Requests <span class="badge">2</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span> My Clients</div>
    <div class="nav-item"><span class="nav-icon">📁</span> My Documents</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Account</div>
    <div class="nav-item"><span class="nav-icon">⚙️</span> Settings</div>
    <div class="nav-item"><span class="nav-icon">🔔</span> Notifications</div>
  </div>
  <div class="sidebar-footer">
    <div class="logout-btn"><span>🚪</span> Logout</div>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">Agent Dashboard</div>
    <div class="topbar-right">
      <div class="search-bar">
        <span style="color:var(--muted);font-size:14px;">🔍</span>
        <input placeholder="Search by location, price, type…"/>
      </div>
      <div class="notif-btn">🔔<div class="notif-dot"></div></div>
    </div>
  </div>

  <div class="content">
    <!-- PARTS 2–3 CONTENT HERE -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function openModal(id) { document.getElementById('modal-' + id).classList.add('open'); }
function closeModal(id) { document.getElementById('modal-' + id).classList.remove('open'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
