<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Realco — Property Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════
   DESIGN SYSTEM
═══════════════════════════════ */
:root {
  --bg:            #F8FAFC;
  --surface:       #FFFFFF;
  --primary:       #4F46E5;
  --primary-hover: #4338CA;
  --primary-light: #EEF2FF;
  --accent:        #06B6D4;
  --accent-light:  #ECFEFF;
  --text:          #0F172A;
  --subtext:       #475569;
  --muted:         #94A3B8;
  --border:        #E2E8F0;
  --success:       #10B981;
  --success-light: #D1FAE5;
  --warning:       #F59E0B;
  --warning-light: #FEF3C7;
  --danger:        #EF4444;
  --danger-light:  #FEE2E2;
  --info:          #3B82F6;
  --info-light:    #DBEAFE;
  --sidebar-w:     240px;
  --topbar-h:      60px;
  --radius:        12px;
  --radius-lg:     16px;
  --shadow-sm:     0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:     0 4px 16px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  --shadow-lg:     0 12px 40px rgba(15,23,42,.10);
  --t: .18s;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════
   SIDEBAR
═══════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top:0; left:0; bottom:0; z-index:50;
}
.sidebar-logo {
  height: var(--topbar-h); padding: 0 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo-icon { width:32px; height:32px; background:var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; }
.logo-text  { font-size:18px; font-weight:800; color:var(--text); letter-spacing:-0.03em; }
.logo-text span { color:var(--primary); }

/* Mode pill */
.mode-pill {
  margin: 10px 12px 4px;
  border-radius: var(--radius); padding: 10px 13px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--border);
}
.mode-pill.owner { background:var(--primary-light); border-color:#C7D2FE; }
.mode-pill.agent { background:var(--accent-light);  border-color:#A5F3FC; }
.mode-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mode-dot.owner { background:var(--primary); }
.mode-dot.agent { background:var(--accent); }
.mode-label { font-size:12px; font-weight:700; }
.mode-label.owner { color:var(--primary); }
.mode-label.agent { color:#0E7490; }

.nav-section { padding: 12px 10px 4px; }
.nav-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:0 8px; margin-bottom:4px; }
.nav-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; border-radius:var(--radius);
  color:var(--subtext); font-size:13.5px; font-weight:500;
  cursor:pointer; transition:background var(--t), color var(--t); margin-bottom:1px;
}
.nav-item:hover  { background:var(--bg); color:var(--text); }
.nav-item.active { background:var(--primary-light); color:var(--primary); font-weight:600; }
.nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.nav-badge {
  margin-left:auto; background:var(--danger); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px;
}

.sidebar-footer { margin-top:auto; padding:12px; border-top:1px solid var(--border); }
.logout-btn {
  display:flex; align-items:center; gap:8px;
  color:var(--subtext); font-size:13px; font-weight:500;
  cursor:pointer; padding:9px 10px; border-radius:var(--radius);
  transition:background var(--t), color var(--t);
}
.logout-btn:hover { color:var(--danger); background:var(--danger-light); }

/* ═══════════════════════════════
   MAIN + TOPBAR
═══════════════════════════════ */
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar {
  background:var(--surface); height:var(--topbar-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40; flex-shrink:0;
}
.topbar-left { display:flex; align-items:center; gap:10px; }
.back-crumb {
  font-size:13px; color:var(--subtext); cursor:pointer; font-weight:500;
  transition:color var(--t);
}
.back-crumb:hover { color:var(--text); }
.crumb-sep   { color:var(--border); font-size:16px; }
.crumb-active { font-size:13px; font-weight:700; color:var(--text); }

.topbar-right { display:flex; align-items:center; gap:8px; }
.view-toggle {
  display:flex; background:var(--bg);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:3px; gap:3px;
}
.vt-btn {
  padding:6px 14px; border-radius:9px;
  font-size:12px; font-weight:600; cursor:pointer;
  border:none; font-family:'Inter',sans-serif;
  color:var(--subtext); background:transparent;
  transition:all var(--t);
}
.vt-btn.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }
.vt-btn:hover:not(.active) { color:var(--text); }

.topbar-action {
  padding:7px 16px; border-radius:var(--radius);
  font-size:12.5px; font-weight:700; font-family:'Inter',sans-serif;
  cursor:pointer; border:none; display:flex; align-items:center; gap:6px;
  transition:all var(--t);
}
.topbar-action.primary { background:var(--primary); color:#fff; }
.topbar-action.primary:hover { background:var(--primary-hover); transform:translateY(-1px); }
.topbar-action.ghost { background:var(--bg); color:var(--subtext); border:1px solid var(--border); }
.topbar-action.ghost:hover { background:var(--surface); color:var(--text); }

/* ═══════════════════════════════
   CONTENT
═══════════════════════════════ */
.content { padding:24px 28px; flex:1; }

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
.toast {
  position:fixed; bottom:24px; right:24px;
  background:var(--text); color:#fff;
  padding:12px 18px; border-radius:var(--radius-lg);
  font-size:13.5px; font-weight:500;
  border-left:3px solid var(--primary);
  box-shadow:var(--shadow-lg);
  transform:translateY(80px); opacity:0;
  transition:all .32s cubic-bezier(.34,1.56,.64,1);
  z-index:999; max-width:300px;
}
.toast.show { transform:translateY(0); opacity:1; }

/* PARTS 2–3 BELOW */

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .main { margin-left:0; }
  .content { padding:16px; }
}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">R</div>
    <span class="logo-text">real<span>co</span></span>
  </div>

  <div class="mode-pill owner" id="sidebar-mode-pill">
    <div class="mode-dot owner" id="sidebar-mode-dot"></div>
    <span class="mode-label owner" id="sidebar-mode-label">🏠 Owner Mode</span>
  </div>

  <div class="nav-section">
    <div class="nav-label">Menu</div>
    <div class="nav-item"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item"><span class="nav-icon">🏗️</span> My Projects</div>
    <div class="nav-item active"><span class="nav-icon">🏢</span> Property Matrix</div>
    <div class="nav-item"><span class="nav-icon">📋</span> Agent Requests <span class="nav-badge">4</span></div>
    <div class="nav-item"><span class="nav-icon">📁</span> Documents</div>
    <div class="nav-item"><span class="nav-icon">📝</span> Notes</div>
  </div>

  <div class="sidebar-footer">
    <div class="logout-btn"><span>🚪</span> Logout</div>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">

  <div class="topbar">
    <div class="topbar-left">
      <span class="back-crumb" onclick="showToast('← Going back to projects…')">← Projects</span>
      <span class="crumb-sep">/</span>
      <span class="crumb-active">Skyline Residency</span>
    </div>
    <div class="topbar-right">
      <div class="view-toggle">
        <button class="vt-btn active" onclick="switchMode('owner',this)">🏠 Owner</button>
        <button class="vt-btn" onclick="switchMode('agent',this)">🤝 Agent</button>
      </div>
      <button class="topbar-action ghost" onclick="openModal('add-floor')">+ Add Floor</button>
      <button class="topbar-action primary" id="topbar-main-btn" onclick="openModal('add-unit')">+ Add Unit</button>
    </div>
  </div>

  <div class="content">
    <!-- PART 2 HERE -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}
function openModal(id)  { const el = document.getElementById('modal-'+id); if(el) el.classList.add('open'); }
function closeModal(id) { const el = document.getElementById('modal-'+id); if(el) el.classList.remove('open'); }
</script>
</body>
</html>
