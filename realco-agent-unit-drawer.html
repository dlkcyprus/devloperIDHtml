<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Realco — Agent Unit Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════
   DESIGN SYSTEM
═══════════════════════════════ */
:root {
  --bg:            #F8FAFC;
  --surface:       #FFFFFF;
  --primary:       #4F46E5;
  --primary-light: #EEF2FF;
  --accent:        #06B6D4;
  --accent-hover:  #0891B2;
  --accent-light:  #ECFEFF;
  --text:          #0F172A;
  --subtext:       #475569;
  --muted:         #94A3B8;
  --border:        #E2E8F0;
  --success:       #10B981;
  --success-light: #D1FAE5;
  --warning:       #F59E0B;
  --warning-light: #FEF3C7;
  --danger:        #EF4444;
  --danger-light:  #FEE2E2;
  --info:          #3B82F6;
  --info-light:    #DBEAFE;
  --sidebar-w:     240px;
  --topbar-h:      60px;
  --drawer-w:      420px;
  --radius:        12px;
  --radius-lg:     16px;
  --shadow-sm:     0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:     0 4px 16px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  --shadow-lg:     0 12px 40px rgba(15,23,42,.10);
  --t: .18s;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════
   SIDEBAR
═══════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top:0; left:0; bottom:0; z-index:50;
}
.sidebar-logo {
  height: var(--topbar-h); padding: 0 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo-icon { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; }
.logo-text  { font-size:18px; font-weight:800; color:var(--text); letter-spacing:-0.03em; }
.logo-text span { color:var(--accent); }

.agent-badge {
  margin: 10px 12px 4px;
  background: var(--accent-light); border: 1px solid #A5F3FC;
  border-radius: var(--radius); padding: 11px 13px;
  display: flex; align-items: center; gap: 10px;
}
.agent-av {
  width:36px; height:36px; border-radius:10px; flex-shrink:0;
  background:var(--accent); display:flex; align-items:center;
  justify-content:center; font-size:13px; font-weight:800; color:#fff;
}
.agent-name     { font-size:13px; font-weight:700; color:var(--text); }
.agent-role     { font-size:11px; color:#0E7490; font-weight:500; }
.agent-verified { font-size:10.5px; color:var(--success); font-weight:600; margin-top:1px; }

.nav-section { padding: 12px 10px 4px; }
.nav-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:0 8px; margin-bottom:4px; }
.nav-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; border-radius:var(--radius);
  color:var(--subtext); font-size:13.5px; font-weight:500;
  cursor:pointer; transition:background var(--t), color var(--t); margin-bottom:1px;
}
.nav-item:hover  { background:var(--bg); color:var(--text); }
.nav-item.active { background:var(--accent-light); color:#0E7490; font-weight:600; }
.nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.nav-badge {
  margin-left:auto; font-size:10px; font-weight:700;
  padding:2px 7px; border-radius:99px;
}
.nav-badge.gold  { background:var(--warning); color:#fff; }
.nav-badge.orange{ background:var(--warning); color:#fff; }

.sidebar-footer { margin-top:auto; padding:12px; border-top:1px solid var(--border); }
.logout-btn {
  display:flex; align-items:center; gap:8px;
  color:var(--subtext); font-size:13px; font-weight:500;
  cursor:pointer; padding:9px 10px; border-radius:var(--radius);
  transition:background var(--t), color var(--t);
}
.logout-btn:hover { color:var(--danger); background:var(--danger-light); }

/* ═══════════════════════════════
   MAIN + TOPBAR
═══════════════════════════════ */
.main {
  margin-left: var(--sidebar-w); flex:1;
  display:flex; flex-direction:column; min-width:0;
  transition: margin-right .35s cubic-bezier(.4,0,.2,1);
}
.main.drawer-open { margin-right: var(--drawer-w); }

.topbar {
  background:var(--surface); height:var(--topbar-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40; flex-shrink:0;
}
.topbar-left { display:flex; align-items:center; gap:10px; }
.back-btn {
  display:flex; align-items:center; gap:5px;
  font-size:13px; color:var(--subtext); cursor:pointer;
  padding:5px 10px; border-radius:var(--radius);
  font-weight:500; transition:all var(--t);
}
.back-btn:hover { background:var(--bg); color:var(--text); }
.crumb-sep    { color:var(--border); font-size:16px; }
.crumb-active { font-size:13px; font-weight:700; color:var(--text); }
.topbar-right { display:flex; align-items:center; gap:10px; }
.sl-pill {
  display:flex; align-items:center; gap:7px;
  padding:7px 14px; background:var(--warning-light);
  border:1px solid #FDE68A; border-radius:var(--radius);
  font-size:12px; font-weight:700; color:#92400E;
  cursor:pointer; transition:background var(--t);
}
.sl-pill:hover { background:#FEF3C7; }
.sl-pill .badge {
  background:var(--warning); color:#fff;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:800;
}

/* ═══════════════════════════════
   CONTENT
═══════════════════════════════ */
.content { padding:22px 26px; flex:1; }

/* ═══════════════════════════════
   DRAWER OVERLAY + DRAWER
═══════════════════════════════ */
.drawer-overlay {
  position:fixed; inset:0;
  background:rgba(15,23,42,.3);
  z-index:90; opacity:0; pointer-events:none;
  transition:opacity .35s ease;
}
.drawer-overlay.open { opacity:1; pointer-events:all; }

.drawer {
  position:fixed; top:0; right:0; bottom:0;
  width:var(--drawer-w); background:var(--surface);
  z-index:100;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  box-shadow:-8px 0 40px rgba(15,23,42,.12);
  border-left:1px solid var(--border);
}
.drawer.open { transform:translateX(0); }

/* Drawer header */
.drawer-header {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; background:var(--surface);
  position:sticky; top:0; z-index:1;
}
.dh-left { display:flex; align-items:center; gap:10px; }
.dh-id   { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-.02em; }
.dh-status {
  font-size:11px; font-weight:700; padding:4px 11px; border-radius:99px;
}
.dh-status.available { background:var(--success-light); color:#065F46; }
.dh-status.hold      { background:var(--warning-light); color:#92400E; }
.dh-status.booked    { background:var(--primary-light); color:var(--primary); }
.drawer-close {
  width:30px; height:30px; border-radius:9px;
  border:1px solid var(--border); background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:14px; color:var(--subtext);
  transition:all var(--t); flex-shrink:0;
}
.drawer-close:hover { background:var(--text); color:#fff; border-color:var(--text); }

/* Drawer body */
.drawer-body {
  flex:1; overflow-y:auto; padding:20px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.drawer-body::-webkit-scrollbar { width:4px; }
.drawer-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* Drawer footer */
.drawer-footer {
  padding:14px 20px; border-top:1px solid var(--border);
  flex-shrink:0; background:var(--surface); display:flex; gap:8px;
}
.df-btn {
  flex:1; padding:11px; border-radius:var(--radius);
  font-size:13px; font-weight:700; font-family:'Inter',sans-serif;
  cursor:pointer; border:none; transition:all .2s;
}
.df-btn.cancel  { background:var(--bg); color:var(--subtext); border:1px solid var(--border); }
.df-btn.cancel:hover  { background:var(--border); color:var(--text); }
.df-btn.primary { background:var(--text); color:#fff; }
.df-btn.primary:hover { background:#1E293B; transform:translateY(-1px); box-shadow:var(--shadow-md); }
.df-btn.gold    { background:var(--accent); color:#fff; }
.df-btn.gold:hover    { background:var(--accent-hover); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.df-btn.success { background:var(--success); color:#fff; }
.df-btn:disabled { opacity:.4; pointer-events:none; transform:none !important; box-shadow:none !important; }

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
.toast {
  position:fixed; bottom:80px; right:24px;
  background:var(--text); color:#fff;
  padding:12px 18px; border-radius:var(--radius-lg);
  font-size:13.5px; font-weight:500;
  border-left:3px solid var(--accent);
  box-shadow:var(--shadow-lg);
  transform:translateY(80px); opacity:0;
  transition:all .32s cubic-bezier(.34,1.56,.64,1);
  z-index:999; max-width:300px;
}
.toast.show { transform:translateY(0); opacity:1; }

/* PARTS 2–3 BELOW */

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .main { margin-left:0; }
  .main.drawer-open { margin-right:0; }
  .drawer { width:100%; }
  .content { padding:16px; }
}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">R</div>
    <span class="logo-text">real<span>co</span></span>
  </div>

  <div class="agent-badge">
    <div class="agent-av">PS</div>
    <div>
      <div class="agent-name">Priya Sharma</div>
      <div class="agent-role">🤝 Real Estate Agent</div>
      <div class="agent-verified">✅ RERA Verified</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Navigation</div>
    <div class="nav-item"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item"><span class="nav-icon">🏗️</span> Browse Projects</div>
    <div class="nav-item active"><span class="nav-icon">🏢</span> Unit Matrix</div>
    <div class="nav-item"><span class="nav-icon">⭐</span> Shortlist <span class="nav-badge gold" id="sl-nav">0</span></div>
    <div class="nav-item"><span class="nav-icon">📋</span> My Requests <span class="nav-badge orange" id="req-nav">0</span></div>
    <div class="nav-item"><span class="nav-icon">📁</span> Documents</div>
  </div>

  <div class="sidebar-footer">
    <div class="logout-btn"><span>🚪</span> Logout</div>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main" id="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="back-btn" onclick="showToast('← Going back…')">← Projects</div>
      <span class="crumb-sep">/</span>
      <span class="crumb-active">Skyline Residency — Tower A</span>
    </div>
    <div class="topbar-right">
      <div class="sl-pill" id="sl-top-pill">
        ⭐ Shortlist <div class="badge" id="sl-top-count">0</div>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- PART 2 HERE -->
  </div>
</div>

<!-- ══ DRAWER ══ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="dh-left">
      <div class="dh-id" id="dh-id">A-203</div>
      <div class="dh-status available" id="dh-status">● Available</div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <!-- DRAWER CONTENT PART 2 -->
  </div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}
function closeDrawer() { showToast('Drawer closed'); }
</script>
</body>
</html>
