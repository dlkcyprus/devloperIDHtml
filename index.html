<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevloperID — Premium Digital Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>

    /* ═══════════════════════════════
       PART 1 — FOUNDATION
    ═══════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Bright, modern palette */
      --azure:       #4F8EF7;   /* primary blue  */
      --azure-dark:  #2D6FE8;
      --azure-pale:  #EBF2FF;
      --violet:      #7C5CFC;   /* accent violet */
      --violet-pale: #F0ECFF;
      --coral:       #FF6B6B;   /* highlight     */
      --emerald:     #22C993;   /* success/badge */
      --sun:         #FFB830;   /* warm accent   */

      --white:       #FFFFFF;
      --surface:     #F8F9FE;   /* page bg       */
      --surface-2:   #F0F4FF;   /* alt section   */
      --ink:         #0F172A;
      --ink-soft:    #475569;
      --ink-muted:   #94A3B8;
      --border:      #E2E8F0;

      --shadow-sm:   0 1px 8px  rgba(79,142,247,.10);
      --shadow-md:   0 6px 24px rgba(79,142,247,.15);
      --shadow-lg:   0 16px 56px rgba(79,142,247,.20);
      --shadow-xl:   0 28px 80px rgba(15,23,42,.15);

      --radius:      20px;
      --radius-sm:   10px;
      --radius-xs:   6px;
      --ease:        cubic-bezier(.4,0,.2,1);
      --t:           .26s;
    }

    html { scroll-behavior: smooth; font-size: 17px; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
      line-height: 1.2;
      color: var(--ink);
    }

    /* ── Scroll progress bar ── */
    #progress-bar {
      position: fixed; top: 0; left: 0; z-index: 200;
      height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--azure), var(--violet));
      transition: width .1s linear;
    }

    /* ── Utilities ── */
    .container   { width: 90%; max-width: 1180px; margin: 0 auto; }
    .section     { padding: 110px 0; }
    .section-alt { background: var(--surface-2); }

    .eyebrow {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .13em;
      text-transform: uppercase; color: var(--azure);
      margin-bottom: .9rem;
    }
    .eyebrow::before {
      content: ''; display: block;
      width: 20px; height: 2px;
      background: var(--azure); border-radius: 2px;
    }
    .section-title {
      font-size: clamp(1.9rem, 3.5vw, 2.75rem);
      font-weight: 700; margin-bottom: 1.1rem;
    }
    .section-sub {
      font-size: 1rem; color: var(--ink-soft);
      max-width: 500px; font-weight: 400; line-height: 1.8;
    }
    .centered { text-align: center; }
    .centered .section-sub { margin: 0 auto; }
    .centered .eyebrow { justify-content: center; }
    .centered .eyebrow::before { display: none; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: .28rem .85rem;
      border-radius: 50px;
      font-size: .72rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase;
    }
    .badge-blue   { background: var(--azure-pale);  color: var(--azure); }
    .badge-violet { background: var(--violet-pale); color: var(--violet); }
    .badge-green  { background: #D1FAF0; color: #0D9B6E; }
    .badge-sun    { background: #FFF3D6; color: #B87A00; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .85rem 2rem;
      border-radius: 50px;
      font-size: .9rem; font-weight: 600; letter-spacing: .03em;
      text-decoration: none; cursor: pointer; border: none;
      transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t);
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--azure), var(--violet));
      color: var(--white);
      box-shadow: 0 4px 18px rgba(79,142,247,.38);
    }
    .btn-primary:hover { box-shadow: 0 10px 32px rgba(79,142,247,.45); }

    .btn-ghost {
      background: var(--white);
      color: var(--ink);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-ghost:hover { border-color: var(--azure); color: var(--azure); box-shadow: var(--shadow-md); }

    .btn-white {
      background: var(--white);
      color: var(--azure);
      box-shadow: 0 4px 18px rgba(15,23,42,.15);
    }
    .btn-white:hover { box-shadow: 0 10px 32px rgba(15,23,42,.2); }

    /* ── Fade-up animation ── */
    .fade-up {
      opacity: 0; transform: translateY(28px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ════════════════════════════
       NAVBAR
    ════════════════════════════ */
    .navbar {
      position: sticky; top: 3px; z-index: 100;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 70px;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; font-weight: 700;
      color: var(--ink); text-decoration: none; letter-spacing: .01em;
    }
    .logo span {
      background: linear-gradient(135deg, var(--azure), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      font-size: .82rem; font-weight: 600; letter-spacing: .06em;
      color: var(--ink-soft); text-decoration: none; text-transform: uppercase;
      transition: color var(--t);
    }
    .nav-links a:hover { color: var(--azure); }

    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 4px;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--ink); border-radius: 2px;
      transition: transform var(--t), opacity var(--t);
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav {
      display: none; position: fixed; inset: 73px 0 0 0;
      background: rgba(255,255,255,.97); backdrop-filter: blur(20px);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 2.2rem; z-index: 99;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      font-size: 1.35rem; font-weight: 600; color: var(--ink);
      text-decoration: none; text-transform: uppercase; letter-spacing: .06em;
      transition: color var(--t);
    }
    .mobile-nav a:hover { color: var(--azure); }

    @media (max-width: 768px) {
      .nav-links, .btn-nav-wrap { display: none !important; }
      .hamburger { display: flex; }
      .section { padding: 75px 0; }
    }
    @media (max-width: 480px) {
      html { font-size: 16px; }
    }

  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <!-- ══ NAVBAR ══ -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="#" class="logo">Devloper<span>ID</span></a>
      <ul class="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#process">Process</a></li>
        <li><a href="#portfolio">Work</a></li>
        <li><a href="#testimonials">Clients</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="btn-nav-wrap">
        <a href="#contact" class="btn btn-primary" style="padding:.55rem 1.4rem;font-size:.82rem;">Get Started</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <nav class="mobile-nav" id="mobileNav">
    <a href="#services"     onclick="closeMobile()">Services</a>
    <a href="#process"      onclick="closeMobile()">Process</a>
    <a href="#portfolio"    onclick="closeMobile()">Work</a>
    <a href="#testimonials" onclick="closeMobile()">Clients</a>
    <a href="#contact"      onclick="closeMobile()">Contact</a>
    <a href="#contact" class="btn btn-primary" onclick="closeMobile()">Get Started</a>
  </nav>

  <!-- PARTS 2-4 WILL BE ADDED BELOW -->

  <script>
    /* progress bar */
    const bar = document.getElementById('progress-bar');
    window.addEventListener('scroll', () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      bar.style.width = pct + '%';
    }, { passive: true });

    /* mobile menu */
    const hbg = document.getElementById('hamburger');
    const mnav = document.getElementById('mobileNav');
    hbg.addEventListener('click', () => {
      const o = mnav.classList.toggle('open');
      hbg.classList.toggle('open', o);
      document.body.style.overflow = o ? 'hidden' : '';
    });
    function closeMobile() {
      mnav.classList.remove('open');
      hbg.classList.remove('open');
      document.body.style.overflow = '';
    }

    /* fade-up observer */
    const io = new IntersectionObserver(entries => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), e.target.dataset.delay || 0);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => io.observe(el));
  </script>
</body>
</html>
